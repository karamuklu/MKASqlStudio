name: Build and publish Windows package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained app
        run: dotnet publish WindowsMssqlStudio.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Create release package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WindowsMssqlStudio-release.zip -Force

      - name: Upload package to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload MkaSqlStudio WindowsMssqlStudio-release.zip --repo ${{ github.repository }} --clobber
